<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5c6577" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#33d6a4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="#101319"/>

  <!-- title -->
  <text x="48" y="58" fill="#e7ebf2" font-size="34" font-weight="700">Kill the orchestrator.</text>
  <text x="478" y="57" fill="#8b94a5" font-size="20" font-weight="400">What happens next isn&#8217;t scripted &#8212; it falls out of the topology.</text>

  <!-- ============================= LEFT: ORCHESTRATOR ============================= -->
  <rect x="40" y="96" width="545" height="512" rx="16" fill="#181d27" stroke="#2b3340"/>
  <text x="70" y="134" fill="#8b94a5" font-size="14" font-weight="600" letter-spacing="1.4">ORCHESTRATOR MODE</text>
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="118" height="26" rx="13" fill="#241316" stroke="#ff5f5f"/>
    <text x="59" y="18" fill="#ff9a9a" font-size="13" text-anchor="middle">&#9986; boss killed</text>
  </g>

  <!-- boss -->
  <g>
    <rect x="202" y="164" width="220" height="58" rx="10" fill="#241316" stroke="#ff5f5f" stroke-dasharray="5 4"/>
    <text x="312" y="190" fill="#ff9a9a" font-size="16" font-weight="600" text-anchor="middle">orchestrator</text>
    <text x="312" y="209" fill="#9a6a6a" font-size="12.5" text-anchor="middle">drives every step &#183; now offline</text>
  </g>

  <!-- cut control link boss -> chain -->
  <path d="M312,222 L312,266" stroke="#5c2020" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="336" y="250" fill="#ff5f5f" font-size="20">&#9986;</text>

  <!-- frozen worker chain -->
  <g>
    <rect x="217" y="268" width="190" height="44" rx="9" fill="#1e2531" stroke="#2b3340"/>
    <text x="312" y="295" fill="#8b94a5" font-size="14.5" text-anchor="middle">research</text>
  </g>
  <path d="M312,312 L312,332" stroke="#2b3340" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="217" y="334" width="190" height="44" rx="9" fill="#1e2531" stroke="#2b3340"/>
    <text x="312" y="361" fill="#8b94a5" font-size="14.5" text-anchor="middle">draft</text>
  </g>
  <path d="M312,378 L312,398" stroke="#2b3340" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="217" y="400" width="190" height="44" rx="9" fill="#1e2531" stroke="#2b3340"/>
    <text x="312" y="427" fill="#8b94a5" font-size="14.5" text-anchor="middle">validation</text>
  </g>
  <path d="M312,444 L312,464" stroke="#2b3340" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="217" y="466" width="190" height="46" rx="9" fill="#1e2531" stroke="#2b3340"/>
    <text x="312" y="494" fill="#5c6577" font-size="14.5" text-anchor="middle">activate &#183; never reached</text>
  </g>

  <!-- verdict badge -->
  <g transform="translate(163,548)">
    <rect x="0" y="0" width="300" height="40" rx="20" fill="#241316" stroke="#ff5f5f"/>
    <text x="150" y="26" fill="#ff9a9a" font-size="15" font-weight="600" text-anchor="middle">STALLS &#8212; nobody owns the case</text>
  </g>

  <!-- ============================= RIGHT: HYBRID MESH ============================= -->
  <rect x="615" y="96" width="545" height="512" rx="16" fill="#181d27" stroke="#2b3340"/>
  <text x="645" y="134" fill="#8b94a5" font-size="14" font-weight="600" letter-spacing="1.4">HYBRID MESH MODE</text>
  <g transform="translate(1005,120)">
    <rect x="0" y="0" width="118" height="26" rx="13" fill="#241316" stroke="#ff5f5f"/>
    <text x="59" y="18" fill="#ff9a9a" font-size="13" text-anchor="middle">&#9986; boss killed</text>
  </g>

  <!-- links worker <-> blackboard (draw first, behind nodes) -->
  <g stroke="#33d6a4" stroke-width="1.8" opacity="0.55">
    <path d="M745,262 L840,332"/>
    <path d="M1030,262 L935,332"/>
    <path d="M745,470 L840,392"/>
    <path d="M1030,470 L935,392"/>
  </g>
  <!-- redundant orchestrator peer link (dashed, cut) -->
  <path d="M887,214 L887,262" stroke="#5c2020" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="899" y="245" fill="#ff5f5f" font-size="17">&#9986;</text>

  <!-- redundant peer -->
  <g>
    <rect x="812" y="170" width="150" height="44" rx="9" fill="#1e2531" stroke="#3a3340" stroke-dasharray="4 3"/>
    <text x="887" y="190" fill="#8b94a5" font-size="13.5" text-anchor="middle">orchestrator</text>
    <text x="887" y="206" fill="#9a6a6a" font-size="11.5" text-anchor="middle">redundant peer &#183; killed</text>
  </g>

  <!-- blackboard (shared state, center) -->
  <g>
    <rect x="812" y="330" width="150" height="62" rx="10" fill="#1e2531" stroke="#e8b98f"/>
    <text x="887" y="358" fill="#e8b98f" font-size="15" font-weight="600" text-anchor="middle">blackboard</text>
    <text x="887" y="377" fill="#8b6f52" font-size="12" text-anchor="middle">shared state</text>
  </g>

  <!-- workers (each its own task, watching the board) -->
  <g>
    <rect x="655" y="218" width="180" height="46" rx="9" fill="#16241f" stroke="#33d6a4"/>
    <text x="745" y="240" fill="#eafff6" font-size="14.5" text-anchor="middle">research</text>
    <text x="745" y="256" fill="#4b9c7e" font-size="11.5" text-anchor="middle">own task &#183; fired</text>
  </g>
  <g>
    <rect x="940" y="218" width="180" height="46" rx="9" fill="#16241f" stroke="#33d6a4"/>
    <text x="1030" y="240" fill="#eafff6" font-size="14.5" text-anchor="middle">draft</text>
    <text x="1030" y="256" fill="#4b9c7e" font-size="11.5" text-anchor="middle">own task &#183; fired</text>
  </g>
  <g>
    <rect x="655" y="458" width="180" height="46" rx="9" fill="#16241f" stroke="#33d6a4"/>
    <text x="745" y="480" fill="#eafff6" font-size="14.5" text-anchor="middle">validation</text>
    <text x="745" y="496" fill="#4b9c7e" font-size="11.5" text-anchor="middle">own task &#183; fired</text>
  </g>
  <g>
    <rect x="940" y="458" width="180" height="46" rx="9" fill="#16241f" stroke="#33d6a4" stroke-width="2"/>
    <text x="1030" y="480" fill="#eafff6" font-size="14.5" text-anchor="middle">activate &#10003;</text>
    <text x="1030" y="496" fill="#4b9c7e" font-size="11.5" text-anchor="middle">peer still watching &#8594; fires</text>
  </g>

  <!-- verdict badge -->
  <g transform="translate(737,548)">
    <rect x="0" y="0" width="300" height="40" rx="20" fill="#16241f" stroke="#33d6a4"/>
    <text x="150" y="26" fill="#7fe6c2" font-size="15" font-weight="600" text-anchor="middle">RECOVERS &#8212; the peers finish it</text>
  </g>

  <!-- footer -->
  <text x="48" y="648" fill="#5c6577" font-size="13.5">Same handlers in both modes. The only difference is how they&#8217;re invoked &#8212; so resilience is a property of the wiring, not a special recovery code path.</text>
</svg>
